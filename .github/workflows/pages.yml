name: Deploy K.Hair Studio PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node scripts/build-test-site.mjs
        env:
          KHAIR_STABLE_REF: 30538597bf2d1d1332eda9abbe3645819f9aeff7
      - run: node scripts/check-test-site.mjs
        env:
          KHAIR_STABLE_REF: 30538597bf2d1d1332eda9abbe3645819f9aeff7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
